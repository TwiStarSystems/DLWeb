services:
  webserver:
    build: .
    container_name: webserver
    ports:
      - "8080:80"
    volumes:
      - ./src:/var/www/html
      - ./logs:/var/log/nginx
      - ./config/mysql/schema.sql:/var/www/html/schema.sql:ro
    environment:
      - DB_HOST=mysql
      - DB_USER=webuser
      - DB_PASSWORD=webpass
      - DB_NAME=webdb
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - webnet

  mysql:
    image: mysql:latest
    container_name: mysql
    environment:
      - MYSQL_ROOT_PASSWORD=rootpass
      - MYSQL_DATABASE=webdb
      - MYSQL_USER=webuser
      - MYSQL_PASSWORD=webpass
    volumes:
      - mysql-data:/var/lib/mysql
      - ./config/mysql/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpass"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - webnet

volumes:
  mysql-data:

networks:
  webnet:
    driver: bridge
